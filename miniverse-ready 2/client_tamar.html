<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miniverse Admin - Tamar Budget Approvals</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 14px;
    }

    select,
    textarea,
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    select:focus,
    textarea:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-hint {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .clear-btn {
      background: #f0f0f0;
      color: #333;
    }

    .clear-btn:hover {
      background: #e0e0e0;
    }

    .response {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }

    .response.success {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      color: #2e7d32;
      display: block;
    }

    .response.error {
      background: #ffebee;
      border: 2px solid #f44336;
      color: #c62828;
      display: block;
    }

    .response h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .response p {
      font-size: 14px;
      line-height: 1.5;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .spinner {
      border: 3px solid #f0f0f0;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .rate-limit {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💼 Miniverse Admin</h1>
    <p class="subtitle">Budget Approvals & Adjustments (Tamar)</p>

    <form id="approvalForm">
      <div class="form-group">
        <label for="action">Action</label>
        <select id="action" name="action" required>
          <option value="">-- Select Action --</option>
          <option value="approve">Approve</option>
          <option value="adjust">Adjust</option>
          <option value="reject">Reject</option>
        </select>
        <p class="form-hint">Choose whether to approve, adjust, or reject</p>
      </div>

      <div class="form-group">
        <label for="percent">Adjustment Percentage (optional)</label>
        <input
          type="number"
          id="percent"
          name="percent"
          placeholder="e.g., 5, 10, -15"
          step="0.1"
        />
        <p class="form-hint">Leave blank if not adjusting</p>
      </div>

      <div class="form-group">
        <label for="details">Details</label>
        <textarea
          id="details"
          name="details"
          placeholder="Explain your decision or adjustments..."
          required
        ></textarea>
        <p class="form-hint">Provide context for your approval/adjustment/rejection</p>
      </div>

      <div class="button-group">
        <button type="submit" class="submit-btn">Submit Approval</button>
        <button type="reset" class="clear-btn">Clear</button>
      </div>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Processing approval...</p>
    </div>

    <div class="response" id="response"></div>

    <div class="rate-limit" id="rateLimit"></div>
  </div>

  <script>
    const API_URL = "https://YOUR_VERCEL_URL/api/tamar";
    const API_KEY = "sk_tamar_ce732a94c0a5f17da9c561e45d533e7a4f2909a8";

    const form = document.getElementById("approvalForm");
    const loading = document.getElementById("loading");
    const response = document.getElementById("response");
    const rateLimit = document.getElementById("rateLimit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const action = document.getElementById("action").value;
      const percent = document.getElementById("percent").value || null;
      const details = document.getElementById("details").value;

      const message = `Action: ${action}, Adjustment: ${percent || "none"}, Details: ${details}`;

      // Show loading state
      loading.style.display = "block";
      response.style.display = "none";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message }),
        });

        const data = await res.json();

        loading.style.display = "none";

        if (res.ok) {
          response.className = "response success";
          response.innerHTML = `
            <h3>✅ Approval Submitted</h3>
            <p><strong>Record ID:</strong> ${data.recordId}</p>
            <p><strong>Action:</strong> ${action.toUpperCase()}</p>
            <p><strong>Status:</strong> ${data.message}</p>
            <p><strong>Details:</strong> ${details}</p>
          `;
          form.reset();
        } else {
          response.className = "response error";
          response.innerHTML = `
            <h3>❌ Error</h3>
            <p>${data.error}</p>
          `;
        }

        // Update rate limit
        if (data.rateLimit !== undefined) {
          rateLimit.textContent = `Requests remaining this hour: ${data.rateLimit}/100`;
        }

        response.style.display = "block";
      } catch (error) {
        loading.style.display = "none";
        response.className = "response error";
        response.innerHTML = `
          <h3>❌ Connection Error</h3>
          <p>${error.message}</p>
        `;
        response.style.display = "block";
      }
    });
  </script>
</body>
</html>
